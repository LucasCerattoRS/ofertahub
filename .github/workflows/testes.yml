# Roda os testes offline (sem rede, sem token) a cada push e pull request.
name: testes
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests/test_pipeline_offline.py tests/test_historico.py -v
